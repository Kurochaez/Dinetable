<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="./asset/css/index.css">
    <title>DineTable</title>
</head>
<body>
    <div id="navbar"></div>

    <div class="container-form">
        <div class="hero-image">
            <img src="./asset/img/hero-img.jpg" alt="hero image by dine table">
        </div>
        <div class="area-form">
            <div class="topic">
                <h1>Book Your Table Online</h1>
                <p>Reserve your dining experience easily</p>
            </div>

            <form class="form-search" action="" method="post">
                <div class="search-container">
                    <input type="search" name="search" id="search" placeholder="Check your phone number reservation">
                    <button class="search-btn">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        Search
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <div id="dashboard"></div>

    

    <script>
        fetch('./components/navbar/navbar.html')
        .then(res => res.text())
        .then(data => {
            document.getElementById("navbar").innerHTML = data;
            initNavbar();
        });
        fetch('./components/dashboard/dashboard.html')
        .then(res => res.text())
        .then(data => {
            document.getElementById("dashboard").innerHTML = data;
            renderBookings();
        });
    </script>

    <script src="./components/navbar/navbar.js"></script>
    <script src="./js/ฺbooking.js"></script>   
</body>
</html>
