<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/frontend/asset/css/login.css">
    <link rel="stylesheet" href="/frontend/asset/css/reserve.css">
    <title>DineTable</title>
</head>
<body>
    <div id="navbar"></div>

    <div class="container-login">
        <div class="message-area">
            <div class="message-item">
                <h1>Welcome</h1>
                <h1>Admin!</h1>
                <p>Manage your reservations easily</p>
            </div>
        </div>
        <div class="login-area">
            <div class="form-item">
                <form action="">
                    <div class="form-login-head">
                        <h2>Admin Login</h2>
                    </div>
                    <div class="area-input">
                        <div class="area-input-container">
                            <div class="form-group">
                                <label>Admin Username</label>
                                <input type="text" name="username" placeholder="Username">
                            </div>
                            <div class="form-group">
                                <label>Password</label>
                                <input type="password" name="password" placeholder="Password">
                            </div>
                            <div class="form-group">
                                <button type="button" onclick="login()">Login</button>
                            </div>
                            <div class="form-group">
                                <div class="error-message" style="display:none;" id="error-message">
                                    Admin Username or Password invalid
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-box">
            <div id="modal-gif" class="modal-gif">
                <img id="modal-img" src="" alt="">
            </div>
            <h3 id="modal-title"></h3>
            <div id="modal-errors" class="modal-errors"></div>
            <button id="modal-btn" onclick="closeModal()">ตกลง</button>
        </div>
    </div>

    <script>
        fetch('/frontend/components/navbar/navbar.html')
        .then(res => res.text())
        .then(data => {
            document.getElementById("navbar").innerHTML = data;
            initNavbar();
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>
    <script src="/frontend/components/navbar/navbar.js"></script>
    <script src="/frontend/pages/admin/login.js"></script>
</body>
</html>
