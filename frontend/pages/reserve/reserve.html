<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/frontend/asset/css/reserve.css">
    <title>DineTable</title>
</head>
<body>
    <div id="navbar"></div>

    <div class="container">
        <div class="form-bg">
            <img src="/frontend/asset/img/hero-img.jpg" alt="hero image by dine table">
        </div>
        <div class="area-form-reserve">
            <form class="form-reserve" action="" method="post">
                <div class="form-reserve-head">
                    <h2>Reserve a Table</h2>
                    <p>please fill in your details</p>
                </div>
                <div class="area-input">
                    <div class="area-input-container">
                        <div class="form-group">
                            <label for="firstname">First Name</label>
                            <input type="text" id = "firstname" name="firstname">
                        </div>
                        <div class="form-group">
                            <label for="lastname">Last Name</label>
                            <input type="text" id ="lastname" name="lastname">
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="text" id = "phone" name="phone">
                        </div>
                        <div class="form-group">
                            <label for="date">Date</label>
                            <input type="date" id = "date" name="date">
                        </div>
                        <div class="row">
                            <div class="form-group">
                                <label for="starttime">Start Time</label>
                                <input type="time" id = "starttime" name="starttime">
                            </div>
                            <div class="form-group">
                                <label for="endtime">End Time</label>
                                <input type="time" id = "endtime" name="endtime">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="nog">Number of Guests</label>
                            <input type="number" id = "nog" name="nog">
                        </div>

                        <div class="form-group">
                            <button type="button"  onclick="SubmitData()">Reserve Table</button>
                        </div>

                    </div>

                </div>
            </form>
        </div>
    </div>

    <script>
        fetch('/frontend/components/navbar/navbar.html')
        .then(res => res.text())
        .then(data => {
            document.getElementById("navbar").innerHTML = data;
            initNavbar();
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>
    <script src="/frontend/components/navbar/navbar.js"></script>
    <script src="/frontend/pages/reserve/reserve.js"></script>
 
</body>
</html>
