<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/frontend/asset/css/reserve.css">
    <title>DineTable</title>
</head>
<body>
    <div id="navbar"></div>

    <div class="container">
        <div class="form-bg">
            <img src="/frontend/asset/img/hero-img.jpg" alt="hero image by dine table">
        </div>
        <div class="area-form-reserve">
            <form class="form-reserve" action="" method="post">
                <div class="form-reserve-head">
                    <h2>Reserve a Table</h2>
                    <p>please fill in your details</p>
                </div>
                <div class="area-input">
                    <div class="area-input-container">
                        <div class="form-group">
                            <label for="">First Name</label>
                            <input type="text" name="firstname" required
                            placeholder="please enter firstname">
                        </div>
                        <div class="form-group">
                            <label for="">Last Name</label>
                            <input type="text" name="lastname" required
                            placeholder="please enter lastname">
                        </div>
                        <div class="form-group">
                            <label for="">Phone Number</label>
                            <input type="text" name="phone" required
                            placeholder="Ex. 098-xxx-xxxx">
                        </div>
                        <div class="form-group">
                            <label for="">Date</label>
                            <input type="date" name="date" required>
                        </div>
                        <div class="row">
                            <div class="form-group">
                                <label for="">Start Time</label>
                                <input type="time" name="starttime" required>
                            </div>
                            <div class="form-group">
                                <label for="">End Time</label>
                                <input type="time" name="endtime" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="">Number of Guests</label>
                            <input type="number" name="nog" min="1" max="15" value="1">
                        </div>

                        <div class="form-group">
                            <button type="submit">Reserve Table</button>
                        </div>
                    </div>

                </div>
            </form>
        </div>
    </div>

    <script>
        fetch('/frontend/components/navbar/navbar.html')
        .then(res => res.text())
        .then(data => {
            document.getElementById("navbar").innerHTML = data;
            initNavbar();
        });
    </script>

    <script src="/frontend/components/navbar/navbar.js"></script>
 
</body>
</html>
