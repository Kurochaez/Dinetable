<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/frontend/asset/css/reserve.css">
    <title>DineTable</title>
</head>
<body>
    <div id="navbar"></div>

    <div class="container">
        <div class="form-bg">
            <img src="/frontend/asset/img/hero-img.jpg" alt="hero image by dine table">
        </div>
        <div class="area-form-reserve">
            <form class="form-reserve" action="" method="post">
                <div class="form-reserve-head">
                    <h2>Reserve a Table</h2>
                    <p>please fill in your details</p>
                </div>
                <div class="area-input">
                    <div class="area-input-container">

                        <div class="form-group">
                            <label for="">First Name</label>
                            <input type="text" name="firstname" required placeholder="Please enter first name">
                        </div>
                        <div class="form-group">
                            <label for="">Last Name</label>
                            <input type="text" name="lastname" required placeholder="Please enter last name">
                        </div>
                        <div class="form-group">
                            <label for="">Phone Number</label>
                            <input type="tel" name="phone"  minlength="10" maxlength="10" pattern="[0-9]{10}" oninput="this.value = this.value.replace(/[^0-9]/g, '');" required placeholder="Ex. 098xxxxxxx">
                        </div>
                        <div class="form-group">
                            <label for="">Date</label>
                            <input type="date" name="date" required>
                        </div>
                        <div class="row">
                            <div class="form-group">
                                <label for="">Start Time</label>
                                <select name="starttime" id="starttime" required>
                                    <option value="" disabled selected>Select Time</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="">End Time</label>
                                <select name="endtime" id="endtime" required>
                                    <option value="" disabled selected>Select Time</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="">Number of Guests</label>
                            <input type="number" name="nog" max="15" min="1" value="1">
                        </div>
                        
                        <div class="form-group">
                            <button type="submit">Reserve Table</button>
                        </div>
                    </div>
                        
                    
                </div>
            </form>
        </div>
    </div>

    <div id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <script src="/frontend/api/api.js"></script>
    <script>
        fetch('/frontend/components/navbar/navbar.html')
        .then(res => res.text())
        .then(data => {
            document.getElementById("navbar").innerHTML = data;
            initNavbar();
            updateMenuVisibility();
        });
        fetch('/frontend/components/toast/toast.html')
        .then(res => res.text())
        .then(data => {
            document.getElementById("toast").innerHTML = data;
        });
    </script>

    <script src="/frontend/components/toast/toast.js"></script>
    <script src="/frontend/components/navbar/navbar.js"></script>
    <script src="/frontend/js/reserve.js"></script>
    <script src="/frontend/js/auth.js"></script>
    <script src="/frontend/js/logout.js"></script>
</body>
</html>
